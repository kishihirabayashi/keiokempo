<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="inner">
      <circle cx="256" cy="256" r="230"/>
    </clipPath>
  </defs>

  <!-- 外周リング(金・二重) -->
  <circle cx="256" cy="256" r="252" fill="#8F7226"/>
  <circle cx="256" cy="256" r="244" fill="#D9B54A"/>
  <circle cx="256" cy="256" r="230" fill="#14275B"/>

  <g clip-path="url(#inner)">
    <!-- 紺地に中央の紅色縦帯(慶應紋章モチーフ) -->
    <rect x="181" y="0" width="150" height="512" fill="#B01E33"/>
    <!-- 縦帯の縁に細い金線 -->
    <rect x="177" y="0" width="4" height="512" fill="#D9B54A" opacity="0.55"/>
    <rect x="331" y="0" width="4" height="512" fill="#D9B54A" opacity="0.55"/>
  </g>

  <!-- 内側の細い金リング -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="#D9B54A" stroke-width="4"/>

  <!-- 王冠(簡略化) -->
  <g fill="#D9B54A">
    <path d="M 206 122
             L 206 96 L 224 110 L 240 88 L 250 106
             L 256 82
             L 262 106 L 272 88 L 288 110 L 306 96 L 306 122 Z"/>
    <rect x="202" y="122" width="108" height="14" rx="5"/>
    <circle cx="206" cy="90" r="6"/>
    <circle cx="240" cy="82" r="6"/>
    <circle cx="256" cy="72" r="7"/>
    <circle cx="272" cy="82" r="6"/>
    <circle cx="306" cy="90" r="6"/>
  </g>

  <!-- 拳(現行デザインを踏襲) -->
  <g fill="#E8C660">
    <!-- 指4本 -->
    <rect x="168" y="162" width="36" height="118" rx="18"/>
    <rect x="214" y="156" width="36" height="124" rx="18"/>
    <rect x="260" y="156" width="36" height="124" rx="18"/>
    <rect x="306" y="162" width="36" height="118" rx="18"/>
    <!-- 手の甲 -->
    <rect x="156" y="266" width="200" height="98" rx="30"/>
    <!-- 親指 -->
    <rect x="162" y="352" width="118" height="44" rx="22"/>
  </g>
</svg>
